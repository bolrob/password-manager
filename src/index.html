<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PasswordManager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // GitHub Pages SPA redirect: restore path from query param
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          window.history.replaceState(
            null,
            null,
            '/' + decodeURIComponent(p[1]).replace(/&/, '?') + window.location.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
