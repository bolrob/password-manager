<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">PassVault</h1>
    <p class="auth-subtitle">Войдите в аккаунт</p>

    <div class="test-accounts">
      <p class="test-accounts-label">Тестовые аккаунты</p>
      <div class="test-accounts-list">
        @for (account of testAccounts; track account.email) {
          <button type="button" class="test-account-btn" (click)="fillTestAccount(account)">
            <span class="test-account-name">{{ account.name }}</span>
            <span class="test-account-desc">{{ account.description }}</span>
          </button>
        }
      </div>
    </div>

    @if (error()) {
      <div class="auth-error" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label tuiLabel>
        Email
        <tui-textfield>
          <input
            tuiTextfield
            formControlName="email"
            type="email"
            placeholder="demo@example.com"
            autocomplete="email"
          />
        </tui-textfield>
      </label>
      <tui-error formControlName="email" />

      <label tuiLabel>
        Пароль
        <tui-textfield>
          <input
            tuiTextfield
            formControlName="password"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
          />
        </tui-textfield>
      </label>
      <tui-error formControlName="password" />

      <button tuiButton type="submit" appearance="primary" class="auth-submit">
        {{ loading() ? 'Загрузка...' : 'Войти' }}
      </button>
    </form>

    <p class="auth-link">Нет аккаунта? <a routerLink="/auth/register">Зарегистрироваться</a></p>
  </div>
</div>
